name: Windows auth diagnostics

on:
  push:
    branches: [diagnostics/windows-auth-persistence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Synthetic self-tests (Windows PowerShell 5.1)
        shell: powershell
        run: '& ./scripts/Diagnose-CodexAuth.ps1 -SelfTest'
      - name: Synthetic self-tests (PowerShell 7)
        shell: pwsh
        run: '& ./scripts/Diagnose-CodexAuth.ps1 -SelfTest'
      - name: Read-only collector smoke (PowerShell 5.1)
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -NonInteractive -File ./scripts/Diagnose-CodexAuth.ps1 -ObserveSeconds 0
          if ($LASTEXITCODE -ne 0) { throw 'Collector smoke failed' }
